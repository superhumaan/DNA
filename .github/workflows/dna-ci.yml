# DNA CI — generated by DNA by Humaan
# Mode: strict (fail on gate violations)
# Quality gates on every push: lint, test, 80% coverage (per-file + total), OWASP audit.

name: DNA CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        continue-on-error: false

      - name: Lint
        run: pnpm run lint
        continue-on-error: false

      - name: Typecheck
        run: pnpm run typecheck
        continue-on-error: false

      - name: Unit tests
        run: pnpm run test
        continue-on-error: false

      - name: Coverage (80% gate)
        run: pnpm run test:coverage
        continue-on-error: false

      - name: Enforce per-file + total coverage >= 80%
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const s = JSON.parse(readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const t = 80;
            const fail = [];
            for (const [file, m] of Object.entries(s)) {
              if (file === 'total') continue;
              if (m.lines.pct < t) fail.push(file + ': lines ' + m.lines.pct + '%');
            }
            if (s.total.lines.pct < t) fail.push('TOTAL: ' + s.total.lines.pct + '%');
            if (fail.length) { console.error(fail.join('\\n')); process.exit(1); }
          "
        continue-on-error: false

      - name: Coverage summary → GitHub Step Summary
        if: always()
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const fs = require('node:fs');
            let s; try { s = JSON.parse(readFileSync('./coverage/coverage-summary.json','utf8')); } catch { process.exit(0); }
            const t = 80;
            const total = s.total || {};
            const below = Object.entries(s).filter(([f,m]) => f!=='total' && m.lines && m.lines.pct < t);
            const L = [];
            L.push('## Coverage');
            L.push('');
            L.push('| Metric | % |');
            L.push('|--------|---|');
            for (const k of ['lines','branches','functions','statements']) L.push('| '+k+' | '+((total[k]||{}).pct ?? '—')+'% |');
            L.push('');
            L.push('Per-file threshold: '+t+'% — '+below.length+' file(s) below.');
            for (const [f,m] of below.slice(0,25)) L.push('- `'+f.split('/').slice(-3).join('/')+'` — '+m.lines.pct+'%');
            const out = process.env.GITHUB_STEP_SUMMARY;
            if (out) fs.appendFileSync(out, L.join('\n')+'\n');
          "
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: DNA Lab load gate (200 concurrent viewers)
        run: pnpm run test:load:lab
        continue-on-error: false

      - name: Upload DNA reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dna-reports
          path: |
            .DNA/reports/
            .dna-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: DNA quality report (lint, test, coverage, SAST)
        run: npx --yes @superhumaan/dna-by-humaan quality report --fail
        continue-on-error: false

  docker:
    name: Docker build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t dna-app:ci .
        continue-on-error: false

  security:
    name: OWASP security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (OWASP-aligned)
        run: pnpm audit --audit-level=high
        continue-on-error: false

