packages:
  - "packages/*"
  - "apps/*"
  - "apps/examples/*"
allowBuilds:
  esbuild: true
# Own publishes are always "too new" for minimumReleaseAge — exclude the CLI package.
minimumReleaseAgeExclude:
  - "@superhumaan/dna-by-humaan"
overrides:
  esbuild: "0.28.1"
  find-my-way: "9.7.0"
  fast-uri: "4.1.1"
  body-parser: "1.20.6"
  postcss: "8.5.23"
  brace-expansion: "5.0.8"
