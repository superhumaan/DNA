# DNA — local smoke test
name: dna

services:
  app:
    build: .
    image: dna:local
    container_name: dna-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    # Override with .env for secrets — never commit real values
    env_file:
      - path: .env
        required: false
